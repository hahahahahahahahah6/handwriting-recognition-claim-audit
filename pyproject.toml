[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-recognition-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for ink transcription"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
handwriting-recognition-claim-audit = "handwriting_recognition_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["handwriting_recognition_claim_audit*"]
